:root{--bg:#f6f2ec;--fg:#1c1a17;--mute:#7a736a;--line:#e0d9cf;--acc:#ff5a1f;--card:#fbf8f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--fg:#f1ebe2;--mute:#9a9288;--line:#2a2621;--card:#1a1713}}
:root[data-theme="dark"]{--bg:#14120f;--fg:#f1ebe2;--mute:#9a9288;--line:#2a2621;--card:#1a1713}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 "Satoshi","Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.serif{font-weight:500;letter-spacing:-.035em}
.wrap{max-width:1400px;margin:0 auto;padding:0 40px}
::selection{background:var(--acc);color:#fff}
::-moz-selection{background:var(--acc);color:#fff}
nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:env(safe-area-inset-top,0px) 12px 0;pointer-events:none}
nav .bar{pointer-events:auto;margin:0 auto;max-width:1560px;display:flex;justify-content:space-between;align-items:center;height:76px;padding:0 24px;border:1px solid transparent;border-radius:99px;transition:all .6s cubic-bezier(.2,.7,.2,1)}
nav.s .bar{max-width:1200px;height:58px;margin-top:12px;background:color-mix(in srgb,var(--bg) 60%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-color:var(--line);box-shadow:0 10px 40px rgba(0,0,0,.08)}
.links{display:flex;gap:26px;font-size:15px;color:var(--mute)}
.links a:hover{color:var(--fg)}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);flex-direction:column;gap:5px;align-items:center;justify-content:center;cursor:pointer;padding:0}
.burger i{display:block;width:18px;height:2px;border-radius:2px;background:var(--fg);transition:.3s}
.burger.o i:first-child{transform:translateY(3.5px) rotate(45deg)}
.burger.o i:last-child{transform:translateY(-3.5px) rotate(-45deg)}
.menu{display:none;position:absolute;top:calc(100% + 8px);left:12px;right:12px;pointer-events:auto;padding:10px;border-radius:24px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.12);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.35s}
.menu.o{opacity:1;visibility:visible;transform:none}
.menu a{display:block;padding:15px 18px;font-size:20px;font-weight:500;letter-spacing:-.02em;border-radius:14px}
.menu a:hover,.menu a:active{background:var(--card);color:var(--acc)}
.clock{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px;transition:.4s;white-space:nowrap}
.clock::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
nav.s .clock{display:none}
.prog{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);z-index:100}
.logo{font-size:22px}.logo i{color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;font-weight:500;font-size:15px;border:1px solid var(--fg);transition:.3s;cursor:pointer;background:none;color:var(--fg);font-family:inherit}
.btn.p{background:var(--fg);color:var(--bg)}
.btn:hover{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-2px)}
section{padding:110px 0}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:18px}
h2{font-size:clamp(34px,5vw,56px);line-height:1.05;margin-bottom:48px;max-width:760px}
.hero{min-height:100svh;display:flex;align-items:center;position:relative;overflow:hidden}
.orb{position:absolute;right:-8%;top:50%;width:min(520px,70vw);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb27a,var(--acc) 45%,transparent 70%);filter:blur(40px);opacity:.45;animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-54%) scale(1.06)}}
.hero h1{font-size:clamp(46px,9vw,112px);line-height:.98;margin:20px 0 28px;position:relative}
.hero h1 em{color:var(--acc);font-style:normal}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;width:100%;max-width:1560px;padding:110px 40px 0;position:relative}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);padding:7px 14px;border-radius:99px;font-size:14px;border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg)}
.hero h1.sans{font-weight:500;letter-spacing:-.045em;line-height:1;font-size:clamp(42px,6.2vw,90px);margin:26px 0 24px}
.g{color:#9a948b}
.btn.p{padding:8px 8px 8px 24px}
.ab{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg)}
.btn.s{border:0;background:none;padding:8px 0 8px 8px}
.btn.s .ab{background:var(--fg);color:var(--bg)}
.btn.s:hover{background:none;color:var(--acc);transform:none}
.trust{display:flex;gap:26px;flex-wrap:wrap;margin-top:44px;color:var(--mute);font-size:14px}
.stage{position:relative;aspect-ratio:4/5;max-width:430px;margin:0 auto;width:100%}
.portrait{z-index:1;position:absolute;inset:6% 12%;border-radius:220px 220px 28px 28px;background:linear-gradient(160deg,#ffb27a,var(--acc) 60%,#c93a0c);overflow:hidden}
.portrait img,.portrait svg{width:100%;height:100%;object-fit:cover;display:block}
.portrait img{object-fit:contain;object-position:50% 100%;transform:scale(1.28);transform-origin:50% 100%;filter:saturate(1.05) contrast(1.03)}
.orbit{position:absolute;left:-16%;width:132%;aspect-ratio:1;top:50%;transform:translateY(-50%);border:1px dashed rgba(255,90,31,.4);border-radius:50%}
.od{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--acc)}
.oc{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border:1px solid var(--mute);border-radius:50%;display:flex;align-items:center;justify-content:center}
.oc::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{translate:0 -5px}}
.fc{z-index:3;position:absolute;width:196px;background:#fff;color:#1c1a17;border-radius:20px;padding:14px 16px;box-shadow:0 18px 44px rgba(40,25,10,.12);animation:bob 12s ease-in-out infinite}
.fc.wide{width:226px;padding:16px 18px}
.fc .hd{display:flex;align-items:center;gap:10px}
.fc .ic{width:32px;height:32px;flex:none;border-radius:10px;background:rgba(255,90,31,.12);color:var(--acc);display:flex;align-items:center;justify-content:center}
.fc .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fc .t{font-size:14px;font-weight:600;line-height:1.2}
.fc .s{font-size:12px;font-weight:600;color:var(--acc);line-height:1.3}
.fc hr{border:0;border-top:1px solid #ece6dd;margin:11px 0 9px}
.fc .d{font-size:12.5px;color:#8a8379;line-height:1.4}
.fc ul{list-style:none;padding:0;margin:0}
.fc li{font-size:12.5px;color:#8a8379;padding:2px 0}
.fc li::before{content:"\2713";color:var(--acc);margin-right:8px;font-weight:600}
.fc .go:hover{background:var(--acc);transform:scale(1.08)}
.fc .go{transition:.3s;width:30px;height:30px;margin:10px 0 0 auto;border-radius:50%;background:#1c1a17;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:32px 0 28px}
.facts>div{padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-weight:500}
.facts span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.about p.lead{color:var(--fg);font-size:clamp(22px,2.3vw,32px);line-height:1.35;letter-spacing:-.02em}
.bigword{z-index:2;position:absolute;left:0;right:0;bottom:-.2em;text-align:center;font:500 clamp(100px,22vw,320px)/1 "Satoshi","Plus Jakarta Sans",sans-serif;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px var(--line);pointer-events:none;white-space:nowrap}
.marq{border-block:1px solid var(--line);overflow:hidden;padding:26px 0;white-space:nowrap}
.marq>div{display:inline-flex;animation:mq 35s linear infinite}
.marq span{font-size:clamp(20px,2.4vw,28px);display:inline-flex;align-items:center;gap:56px;padding-right:56px}
.marq span::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}
@keyframes mq{to{transform:translateX(-50%)}}
.marq:hover>div{animation-play-state:paused}
.marq span{transition:color .3s}
.marq span:hover{color:var(--acc)}
.caret{display:inline-block;width:.06em;height:.8em;background:var(--acc);margin-left:.06em;vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tw{display:inline-block;position:relative;white-space:nowrap}
.tw .ghost{visibility:hidden}
.tw .live{position:absolute;left:0;top:0;white-space:nowrap}
.hero p.lead{font-size:clamp(18px,2vw,22px);max-width:560px;color:var(--mute);margin-bottom:36px;position:relative}
.row{display:flex;gap:12px;flex-wrap:wrap;position:relative}
.tag{display:inline-block;font-size:12.5px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mute);margin:0 6px 6px 0}
.proj{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;padding:44px 0;border-top:1px solid var(--line);align-items:center}
.proj:nth-child(even) .shot{order:2}
.shot{aspect-ratio:16/10;border-radius:18px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:.5s}
.proj:hover .shot{transform:scale(1.02) rotate(-.6deg)}
.shot::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,30%) var(--y,70%),rgba(255,90,31,.35),transparent 60%)}
.shot span{font-size:clamp(34px,5vw,60px);position:relative}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;position:relative;display:block}
.proj h3{font-size:34px;margin:6px 0 10px}
.proj .n{color:var(--acc);font-size:14px}
.proj p{color:var(--mute);margin-bottom:12px}
.proj p b{color:var(--fg);font-weight:500}
.link{border-bottom:1px solid var(--acc);margin-right:18px;font-size:15px}
.about{display:grid;grid-template-columns:1fr 1.15fr;gap:72px;align-items:start}
.about p{color:var(--mute);margin-bottom:20px;font-size:clamp(17px,1.4vw,20px)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--card);transition:.3s}
.card:hover{border-color:var(--acc);transform:translateY(-4px)}
.card h4{font-size:26px;margin-bottom:14px}
.card li{list-style:none;padding:6px 0;border-bottom:1px solid var(--line);color:var(--mute);font-size:15px}
.card li:last-child{border:0}
.job{display:grid;grid-template-columns:200px 1fr;gap:32px;padding:36px 0;border-top:1px solid var(--line)}
.job .d{color:var(--mute);font-size:14px}
.job h3{font-size:30px;margin-bottom:4px}
.job .c{color:var(--acc);margin-bottom:14px}
.job li{margin:0 0 8px 18px;color:var(--mute)}
.big{font-size:clamp(52px,7vw,84px);line-height:1;color:var(--acc);text-align:center;align-self:center}
.contact{text-align:center}
.contact h2{margin:0 auto 32px;font-size:clamp(44px,8vw,96px)}
.contact h2 em{color:var(--acc);font-style:normal}
.mail{font-size:clamp(20px,3vw,32px);border-bottom:1px solid var(--acc);display:inline-block;margin-bottom:36px}
form{max-width:520px;margin:0 auto 40px;display:grid;gap:12px;text-align:left}
input,textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--acc)}
footer{padding:28px 0;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (pointer:fine){body,a,button,input,textarea{cursor:none}}
.dot,.ring{position:fixed;top:0;left:0;pointer-events:none;z-index:999;border-radius:50%;display:none}
@media (pointer:fine){.dot,.ring{display:block}}
.dot{width:7px;height:7px;background:var(--acc);margin:-3.5px 0 0 -3.5px}
.ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1px solid var(--acc);transition:width .25s,height .25s,margin .25s,background .25s}
.ring.h{width:70px;height:70px;margin:-35px 0 0 -35px;background:rgba(255,90,31,.12)}
@media (max-width:760px){.proj,.about,.job,.hero .wrap{grid-template-columns:1fr}.links{display:none}.burger{display:flex}.menu{display:block}.fc{scale:.78}.orbit{display:none}.stage{width:74%}.wrap{padding:0 24px}.hero .wrap{padding:100px 24px 0}.proj:nth-child(even) .shot{order:0}section{padding:72px 0}.orb{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.msg{font-size:14px;color:var(--mute);margin:0;text-align:center}.msg a{color:var(--acc);border-bottom:1px solid var(--acc)}.msg.e{color:#d93a0a}
.ok{display:flex;gap:14px;align-items:center;padding:16px 18px;border:1px solid var(--acc);border-radius:16px;background:rgba(255,90,31,.08);text-align:left;animation:inUp .5s cubic-bezier(.2,.7,.2,1) both}
.ok .tick{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.ok b{display:block;font-size:18px;font-weight:600}
.ok em{font-style:normal;color:var(--mute);font-size:14px}
@media (max-width:760px){.facts{grid-template-columns:1fr}}
.intro{position:fixed;inset:0;z-index:998;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .3s ease}
.intro.p2{opacity:0;pointer-events:none}
.intro .lg{display:flex;align-items:flex-end;font-size:clamp(80px,14vw,130px);font-weight:500;letter-spacing:-.05em;line-height:1;color:var(--fg);animation:inUp .4s cubic-bezier(.2,.7,.2,1) both}
.intro .lg i{flex:none;width:.16em;height:.16em;border-radius:50%;background:var(--acc);margin:0 0 .13em .05em;transition:transform .4s cubic-bezier(.7,0,.84,0)}
.intro.p1 .lg i,.intro.p2 .lg i{transform:scale(170)}
@keyframes inUp{from{opacity:0;transform:translateY(24px)}}
</style>

function useReveal(){useEffect(()=>{const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.12});document.querySelectorAll(".rv").forEach(el=>io.observe(el));return()=>io.disconnect()},[])}

function Cursor(){
 const dot=useRef(),ring=useRef();
 useEffect(()=>{
  let x=0,y=0,rx=0,ry=0,raf;
  const mv=e=>{x=e.clientX;y=e.clientY;dot.current.style.transform=`translate(${x}px,${y}px)`;
   ring.current.classList.toggle("h",!!e.target.closest("a,button,input,textarea,.marq"))};
  const loop=()=>{rx+=(x-rx)*.15;ry+=(y-ry)*.15;ring.current.style.transform=`translate(${rx}px,${ry}px)`;raf=requestAnimationFrame(loop)};
  window.addEventListener("mousemove",mv);loop();
  return()=>{window.removeEventListener("mousemove",mv);cancelAnimationFrame(raf)};
 },[]);
 return <><div className="ring" ref={ring}/><div className="dot" ref={dot}/></>;
}

function Intro(){
 const [ph,setPh]=useState(()=>{try{return sessionStorage.getItem("intro")?3:0}catch(e){return 0}});
 useEffect(()=>{
  if(ph===3)return;
  document.body.style.overflow="hidden";
  const t=[setTimeout(()=>setPh(1),550),setTimeout(()=>setPh(2),880),setTimeout(()=>{setPh(3);document.body.style.overflow="";try{sessionStorage.setItem("intro","1")}catch(e){}},1200)];
  return()=>{t.forEach(clearTimeout);document.body.style.overflow=""};
 },[]);
 if(ph===3)return null;
 return <div className={"intro p"+ph} aria-hidden="true"><div className="lg"><span>s</span><i/></div></div>;
}
function Typer(){
 const [i,setI]=useState(0),[t,setT]=useState(""),[del,setDel]=useState(false);
 useEffect(()=>{
  const w=WORDS[i];let ms=del?45:95;
  if(!del&&t===w)ms=1600;
  if(del&&t==="")ms=350;
  const id=setTimeout(()=>{
   if(!del&&t===w)setDel(true);
   else if(del&&t===""){setDel(false);setI((i+1)%WORDS.length)}
   else setT(del?w.slice(0,t.length-1):w.slice(0,t.length+1));
  },ms);
  return()=>clearTimeout(id);
 },[t,del,i]);
 return <em className="tw"><span className="ghost" aria-hidden="true">{WORDS.reduce((a,b)=>b.length>a.length?b:a)}</span><span className="live">{t}<span className="caret"/></span></em>;
}

 const gm=`${GM}&su=${sub}&body=${body}`;

  const f=()=>{const h=document.documentElement.scrollHeight-innerHeight;bar.current.style.transform=`scaleX(${h>0?Math.min(1,scrollY/h):0})`;setSc(scrollY>40)};
  f();addEventListener("scroll",f,{passive:true});
  return()=>removeEventListener("scroll",f);
 },[]);
 const send=async()=>{
  if(!f.nm.trim()||!/\S+@\S+\.\S+/.test(f.em)||!f.ms.trim()){setSt("err");return}
  if(WEB3FORMS_KEY){
   setSt("sending");
   try{const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:"New portfolio message from "+f.nm,name:f.nm,email:f.em,message:f.ms})});
    const d=await r.json();
    if(d.success){setSt("ok");setF({nm:"",em:"",ms:""});return}}catch(e){}
  }
  window.open(gm,"_blank","noopener");setSt("mail");
 };

  <h1 className="sans">Full stack products <span className="g">built with</span> <Typer/></h1>
  <p className="lead">I build modern, responsive web applications — from the interface to the API — that turn ideas into products people use.</p>
  <div className="row"><a href="#work" className="btn p">View My Work <span className="ab"><Arr/></span></a><a href="#contact" className="btn s">Let's Talk <span className="ab"><Arr/></span></a></div>
  <div className="trust"><span>Interface to API</span><span>AI-integrated apps</span><span>Clean, maintainable code</span><span>Production-grade frontends</span></div>
  </div>
  <div className="stage"><div className="orbit"><i className="od" style={{left:"50%",top:0}}/><i className="od" style={{left:0,top:"50%"}}/><i className="od" style={{left:"50%",top:"100%"}}/><i className="oc" style={{left:"100%",top:"50%"}}/></div><div className="portrait">{PHOTO?<img src={PHOTO} alt="Sufyan Ali"/>:<svg viewBox="0 0 200 250"><circle cx="100" cy="95" r="42" fill="rgba(255,255,255,.88)"/><path d="M20 250c0-62 36-98 80-98s80 36 80 98z" fill="rgba(255,255,255,.88)"/></svg>}</div>
   <div className="fc wide" style={{right:"-25%",top:"2%",rotate:"3deg"}}><div className="hd"><span className="ic"><svg viewBox="0 0 24 24"><path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg></span><div><div className="t">Full Stack</div><div className="s">Interface to API</div></div></div><hr/><ul><li>React &amp; Next.js</li><li>Node &amp; Express</li><li>MongoDB &amp; Python</li></ul><a className="go" href="#work" aria-label="View my work"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
   <div className="fc" style={{left:"-20%",top:"18%",rotate:"-3deg",animationDelay:"-2s"}}><div className="hd"><span className="ic"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span><div><div className="t">Frontend</div><div className="s">React &middot; Next.js</div></div></div><hr/><div className="d">Responsive, reusable UI</div></div>
   <div className="fc" style={{left:"-26%",bottom:"5%",rotate:"2deg",animationDelay:"-4s"}}><div className="hd"><span className="ic"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span><div><div className="t">AI features</div><div className="s">Gemini &middot; OpenRouter</div></div></div><hr/><div className="d">LLM integrations, resume analysis</div></div>
   <div className="fc" style={{right:"-25%",bottom:"3%",rotate:"-2deg",animationDelay:"-1s"}}><div className="hd"><span className="ic"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg></span><div><div className="t">Shipped</div><div className="s">Projects delivered</div></div></div><hr/><div className="d">Search Atlas, NexSaas, Airpoint LLC, CareerGPT &amp; more</div></div>
  </div>
 </div><div className="bigword">SUFYAN</div></header>
 <div className="marq"><div>{[...MARQUEE,...MARQUEE].map((w,i)=><span key={i}>{w}</span>)}</div></div>

 <section id="work"><div className="wrap">
  <div className="eyebrow rv">Projects</div>
  <h2 className="serif rv">Featured projects I've built.</h2>
  {PROJECTS.map((p,i)=><div className="proj rv" key={p.name}>
   <a className="shot" href={p.live||p.code||undefined} target="_blank" rel="noopener" onMouseMove={glow}>{p.img?<img src={p.img} alt={p.name+" screenshot"}/>:<span className="serif">{p.name}</span>}</a>
   <div>
    <div className="n">0{i+1} — {p.tag}</div>
    <h3 className="serif">{p.name}</h3>
    <p>{p.what}</p>
    <p><b>Role:</b> {p.role}</p>
    <p><b>Impact:</b> {p.solved}</p>
    <div style={{margin:"14px 0 18px"}}>{p.tech.map(t=><span className="tag" key={t}>{t}</span>)}</div>
    {p.live&&<a className="link" href={p.live} target="_blank" rel="noopener">Live demo ↗</a>}
    {p.code&&<a className="link" href={p.code} target="_blank" rel="noopener">GitHub ↗</a>}
   </div>
  </div>)}
 </div></section>

 <section id="about"><div className="wrap">
  <div className="eyebrow rv">About</div>
  <h2 className="serif rv">The developer behind the work.</h2>
  <div className="about rv">
   <div>
    <p className="lead">I'm Sufyan Ali, a Full Stack Developer who builds fast, responsive web applications, from polished React and Next.js interfaces to the Node.js and Express APIs behind them.</p>
    <div className="facts"><div><span>Role</span>Full Stack Developer</div><div><span>Experience</span>1.5 years</div><div><span>Education</span>BS Computer Science · Grade A</div><div><span>Currently</span>Frontend Developer, Enigmatix</div></div>
    <div className="row">{LINKS.linkedin&&<a className="link" href={LINKS.linkedin} target="_blank" rel="noopener">LinkedIn ↗</a>}{LINKS.github&&<a className="link" href={LINKS.github} target="_blank" rel="noopener">GitHub ↗</a>}<a className="link" href={GM} target="_blank" rel="noopener">Email ↗</a></div>
   </div>
   <div>
    <p>I have around 1.5 years of professional experience. At Enigmatix, I work on Search Atlas, a large-scale SEO and AI-powered marketing platform, using Next.js, TypeScript, MobX and Tailwind CSS. I also build full-stack products of my own, like CareerGPT, an AI career platform with ATS resume scoring, mock interviews and personalised roadmaps, built on the MERN stack with Gemini and OpenRouter.</p>
    <p>I hold a Bachelor's degree in Computer Science from The Islamia University of Bahawalpur, which I completed with Grade A.</p>
    <p>I enjoy turning messy workflows into clear, fast interfaces, and I care about clean, maintainable code that a team can build on.</p>
    <p>Right now I'm deepening my backend and AI-integration skills while building production-grade frontends at Enigmatix.</p>
   </div>
  </div>
 </div></section>

 <section id="skills"><div className="wrap">
  <div className="eyebrow rv">Skills</div>
  <h2 className="serif rv">Tools I actually use.</h2>
  <div className="skills">{Object.entries(SKILLS).map(([k,v])=><div className="card rv" key={k}><h4 className="serif">{k}</h4><ul>{v.map(s=><li key={s}>{s}</li>)}</ul></div>)}</div>
 </div></section>

 <section id="experience"><div className="wrap">
  <div className="eyebrow rv">Experience</div>
  <h2 className="serif rv">Where I've applied them.</h2>
  {JOBS.map(j=><div className="job rv" key={j.t}>
   <div className="d">{j.d}</div>
   <div><h3 className="serif">{j.t}</h3><div className="c">{j.c}</div><ul>{j.b.map(x=><li key={x}>{x}</li>)}</ul></div>
  </div>)}
 </div></section>

 <section id="education"><div className="wrap">
  <div className="eyebrow rv">Education & achievements</div>
  <div className="job rv" style={{borderTop:0}}>
   <div className="big serif">G-A</div>
   <div><h3 className="serif">Bachelor of Computer Science</h3><div className="c">The Islamia University of Bahawalpur</div><p style={{color:"var(--mute)"}}>Grade A.</p></div>
  </div>
 </div></section>

 <section id="contact" className="contact"><div className="wrap">
  <div className="eyebrow rv">Contact</div>
  <h2 className="serif rv">Have a project in mind? <em>Let's talk.</em></h2>
  <a className="mail rv" href={GM} target="_blank" rel="noopener">{EMAIL}</a>
  <div className="rv" style={{maxWidth:520,margin:"0 auto"}}>
   <div style={{display:"grid",gap:12,textAlign:"left",marginBottom:36}}>
    <input placeholder="Your name" value={f.nm} onChange={upd("nm")}/>
    <input type="email" placeholder="Your email" value={f.em} onChange={upd("em")}/>
    <textarea rows="4" placeholder="Tell me about your project" value={f.ms} onChange={upd("ms")}/>
    <button className="btn p" style={{justifyContent:"center",padding:"17px 24px",fontSize:16}} disabled={st==="sending"} onClick={send}>{st==="sending"?"Sending…":st==="ok"?"Message sent ✓":"Send message"}</button>
    {st==="err"&&<p className="msg e">Please add your name, a valid email and a message.</p>}
    {st==="ok"&&<div className="ok" role="status"><span className="tick">✓</span><div><b>Thank you!</b><em>Your message has been sent. I'll get back to you soon.</em></div></div>}
    {st==="fail"&&<p className="msg e">Couldn't send right now. Please email me directly at <a href={GM} target="_blank" rel="noopener">{EMAIL}</a>.</p>}
    {st==="mail"&&<p className="msg">Gmail should open with your message ready, just press Send. Nothing opened? <a href={gm} target="_blank" rel="noopener">Open Gmail</a> or write to <b>{EMAIL}</b>.</p>}
   </div>
  </div>
  <div className="row rv" style={{justifyContent:"center"}}>
   {LINKS.linkedin&&<a className="link" href={LINKS.linkedin} target="_blank" rel="noopener">LinkedIn ↗</a>}{LINKS.github&&<a className="link" href={LINKS.github} target="_blank" rel="noopener">GitHub ↗</a>}
  </div>
 </div></section>

 <footer><div className="wrap"><span>© 2026 Sufyan Ali</span><span>Full Stack Developer</span></div></footer>
 </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
